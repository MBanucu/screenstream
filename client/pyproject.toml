# screenstream-client: install the Python client for screenstream.
#
# The version is the AAR's version: build.gradle.kts and build.sh carry the same
# number, and test/test_client.py fails if they ever disagree. A release tag is
# checked against this file before publishing, so there is one version per
# release and not a PyPI version beside a Maven version.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "screenstream-client"
version = "0.2.0"
description = "Read the screenstream app's raw RGBA frames and encoded fragmented MP4."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
authors = [{ name = "MBanucu" }]
keywords = ["screen", "android", "streaming", "rgba", "fmp4", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/MBanucu/screenstream"
Documentation = "https://github.com/MBanucu/screenstream#readme"
Issues = "https://github.com/MBanucu/screenstream/issues"

[project.scripts]
screenstream-stream = "screenstream_client.cli:stream_main"
screenstream-fmp4 = "screenstream_client.cli:fmp4_main"

[tool.setuptools]
packages = ["screenstream_client"]
