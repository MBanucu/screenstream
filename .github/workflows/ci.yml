name: ci

# Builds both ways on a machine that is not the phone: build.sh (which is what
# published 0.1.0 and needs no Gradle) and the Gradle build (which produces the
# module metadata). A library that only builds on its author's device is not
# released, so this runs on every push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The wrapper JAR and its distribution URL are the build's trust anchor:
      # this checks the JAR against Gradle's published checksums, and
      # gradle-wrapper.properties pins distributionSha256Sum as well.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No device: the control reply's Bundle wrapper, the key=value vocabulary,
      # and the frame/fMP4 parsers with their data built in memory.
      - name: host-side tests
        run: python3 -m unittest discover -s test -v

      # The distribution is what `pip install screenstream-client` will run, so
      # the console scripts are checked here rather than after a release.
      - name: install the client and check its commands
        run: |
          set -euo pipefail
          python3 -m pip install --no-deps -e client
          screenstream-stream --help >/dev/null
          screenstream-fmp4 --help >/dev/null
          python3 -c "import screenstream_client; print('client', screenstream_client.PROTOCOL_VERSION)"

      - name: Android SDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          manager=$(command -v sdkmanager || echo "$sdk/cmdline-tools/latest/bin/sdkmanager")
          api=$(python3 tools/versions.py compileSdk)
          build_tools=$(python3 tools/versions.py buildTools)
          yes | "$manager" --licenses >/dev/null 2>&1 || true
          "$manager" "platforms;android-$api" "build-tools;$build_tools" >/dev/null
          echo "ANDROID_HOME=$sdk" >>"$GITHUB_ENV"

      # The scripted build, unchanged from the phone: javac, d8, zip, javadoc.
      - name: build.sh
        run: bash build.sh

      - uses: gradle/actions/setup-gradle@v4
      - name: gradle
        run: ./gradlew --no-daemon checkBuildEnv :assembleRelease

      # Both artifacts must contain the same API, however each build got there.
      - name: the two builds agree
        run: |
          set -euo pipefail
          unzip -p build/outputs/aar/screenstream-release.aar classes.jar > /tmp/gradle.jar
          python3 - <<'EOF'
          import subprocess, sys, tempfile, zipfile, os
          def api(jar):
              out = []
              with tempfile.TemporaryDirectory() as d:
                  with zipfile.ZipFile(jar) as z:
                      z.extractall(d)
                  names = []
                  for base, _, files in os.walk(d):
                      for name in sorted(files):
                          if name.endswith('.class'):
                              path = os.path.join(base, name)
                              names.append(os.path.relpath(path, d)[:-len('.class')].replace('/', '.'))
                  for name in sorted(names):
                      out.append(subprocess.run(['javap', '-p', '-classpath', d, name],
                                                capture_output=True, text=True).stdout)
              return ''.join(out)
          a = api('/tmp/gradle.jar')
          b = api(os.path.join('out', [f for f in os.listdir('out') if f.endswith('.jar')
                                       and 'sources' not in f and 'javadoc' not in f][0]))
          if not a.strip():
              sys.exit('javap produced nothing for the Gradle AAR')
          if a != b:
              sys.exit('the two builds expose different APIs')
          print('same API:', a.count('public'), 'public declarations')
          EOF

  # The build is developed on Termux, so CI has a path for a self-hosted phone
  # runner without making every PR wait for one. Set the repository variable
  # TERMUX_RUNNER=true (Settings -> Variables) once such a runner is registered
  # with the labels self-hosted and termux; until then this job is skipped, and
  # tools/termux-build.sh is the documented on-device smoke build.
  termux:
    name: termux smoke build
    if: vars.TERMUX_RUNNER == 'true'
    runs-on: [self-hosted, termux]
    steps:
      - uses: actions/checkout@v4
      - name: check the environment and assembleRelease
        run: tools/termux-build.sh
