name: release

# Publishes a GitHub release to Maven Central. The publishing path is publish.sh,
# the same script that published 0.1.0 from a phone: it builds, signs, writes the
# checksums, assembles the bundle the portal accepts, uploads it and then releases
# the deployment. This workflow imports the key and hands it the secrets, so CI and
# the phone cannot drift into two different release procedures.
#
# Secrets (repository settings -> Secrets and variables -> Actions):
#   SIGNING_KEY            the armored private key, as gpg --export-secret-keys prints it
#   SIGNING_PASSWORD       that key's passphrase; optional, and absent for an
#                          unprotected key such as screenstream's
#   MAVEN_CENTRAL_USERNAME portal user token username
#   MAVEN_CENTRAL_PASSWORD portal user token password
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 0.2.0'
        required: true
        type: string
      # A release event always publishes both. `target` lets a manual run
      # publish only the client, for example to backfill a PyPI project.
      target:
        description: 'Which artifacts to publish'
        required: true
        default: all
        type: choice
        options:
          - all
          - maven
          - pypi

permissions:
  contents: read

jobs:
  maven-central:
    name: publish to Maven Central
    if: ${{ github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'maven' }}
    runs-on: ubuntu-24.04
    steps:
      # The artifact is built from the tag being released, not from main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # A tag that disagrees with the sources publishes an AAR whose version is
      # not the one it was built from, and Central never replaces a version. The
      # client job checks the same thing, but by then Maven would be permanent.
      - name: The tag, the catalog and the client agree
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          catalog=$(python3 tools/versions.py projectVersion)
          declared=$(sed -n 's/^version = "\(.*\)"/\1/p' client/pyproject.toml | head -n 1)
          if [ "$version" != "$catalog" ] || [ "$version" != "$declared" ]; then
            echo "::error::tag $version, libs.versions.toml $catalog, client $declared"
            echo "The AAR, the APK and the client are one version: bump all three with the tag."
            exit 1
          fi
          echo "publishing $version" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          manager=$(command -v sdkmanager || echo "$sdk/cmdline-tools/latest/bin/sdkmanager")
          api=$(python3 tools/versions.py compileSdk)
          build_tools=$(python3 tools/versions.py buildTools)
          yes | "$manager" --licenses >/dev/null 2>&1 || true
          "$manager" "platforms;android-$api" "build-tools;$build_tools" >/dev/null
          echo "ANDROID_HOME=$sdk" >>"$GITHUB_ENV"

      - name: Check the release secrets are present
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          # SIGNING_PASSWORD is optional: screenstream's key has no passphrase, and
          # a GitHub secret cannot hold an empty value, so it is simply unset.
          # publish.sh then signs without the loopback passphrase flags.
          missing=()
          for name in SIGNING_KEY MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Import the signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          # gpg needs a keyring of its own here; the runner has none.
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p -m 700 "$GNUPGHOME"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          [ -n "$fpr" ] || { echo "::error::the imported key has no secret material"; exit 1; }
          echo "PGP_KEY=$fpr" >>"$GITHUB_ENV"
          echo "GNUPGHOME=$GNUPGHOME" >>"$GITHUB_ENV"
          echo "imported $fpr"

      - name: Publish
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
          PGP_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          # Tags are written v0.2.0 as often as 0.2.0; the artifact version is not.
          version=${VERSION#v}
          export VERSION="$version"

          publish_one() {
            artifact=$1
            deployment=$(ARTIFACT="$artifact" bash publish.sh --upload \
              | sed -n 's/^deployment: //p')
            [ -n "$deployment" ] || { echo "::error::no deployment id for $artifact"; exit 1; }
            echo "$artifact deployment $deployment"
            for attempt in $(seq 1 40); do
              state=$(bash publish.sh --status "$deployment" | python3 -c \
                'import json,sys; print(json.load(sys.stdin)["deploymentState"])')
              echo "$artifact attempt $attempt: $state"
              case "$state" in
                VALIDATED) bash publish.sh --publish "$deployment"; return 0 ;;
                FAILED) echo "::error::$artifact validation failed"; exit 1 ;;
              esac
              sleep 15
            done
            echo "::error::$artifact did not validate in time"; exit 1
          }

          # The control surface is screenstream's dependency: publish it first,
          # so a screenstream POM never names a version Central does not have.
          publish_one android-control-surface
          publish_one screenstream
          {
            echo "### screenstream $version"
            echo "Both artifacts were submitted to Maven Central."
          } >>"$GITHUB_STEP_SUMMARY"

  # The Python client is the same release as the AAR: one tag, one version.
  #
  # This uses PyPI trusted publishing, so there is no PYPI_TOKEN secret. Two
  # pieces of setup live in the PyPI project and the repository, not here:
  #   - PyPI: a trusted publisher for project `screenstream-client`, owner
  #     MBanucu, repository screenstream, workflow release.yml, environment pypi.
  #   - GitHub: an environment named `pypi` (optionally with required reviewers).
  # Until they exist this job fails at the upload; see README, "Publishing: PyPI,
  # for the client".
  #
  # It waits for the Maven job because a PyPI filename can never be replaced: if
  # the AAR release fails, uploading the client burns that version with nothing to
  # install it against. A `skipped` dependency is allowed, so a `target: pypi`
  # dispatch still uploads the client on its own.
  pypi:
    name: publish the client to PyPI
    needs: maven-central
    if: ${{ !cancelled() && needs.maven-central.result != 'failure' && (github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'pypi') }}
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A tag and a pyproject version that disagree would publish one release
      # number to PyPI and another to Maven Central.
      - name: The tag and the client version agree
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          declared=$(python3 -c "import tomllib; print(tomllib.load(open('client/pyproject.toml', 'rb'))['project']['version'])")
          if [ "$version" != "$declared" ]; then
            echo "::error::$VERSION is not client/pyproject.toml's version $declared"
            exit 1
          fi
          echo "screenstream-client $version" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the wheel and sdist
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade build
          python3 -m build client --outdir dist
          ls -l dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
