name: release

# Publishes a GitHub release to Maven Central. The publishing path is publish.sh,
# the same script that published 0.1.0 from a phone: it builds, signs, writes the
# checksums, assembles the bundle the portal accepts, uploads it and then releases
# the deployment. This workflow imports the key and hands it the secrets, so CI and
# the phone cannot drift into two different release procedures.
#
# Secrets (repository settings -> Secrets and variables -> Actions):
#   SIGNING_KEY            the armored private key, as gpg --export-secret-keys prints it
#   SIGNING_PASSWORD       that key's passphrase
#   MAVEN_CENTRAL_USERNAME portal user token username
#   MAVEN_CENTRAL_PASSWORD portal user token password
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 0.2.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  maven-central:
    name: publish to Maven Central
    runs-on: ubuntu-24.04
    steps:
      # The artifact is built from the tag being released, not from main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          manager=$(command -v sdkmanager || echo "$sdk/cmdline-tools/latest/bin/sdkmanager")
          yes | "$manager" --licenses >/dev/null 2>&1 || true
          "$manager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_HOME=$sdk" >>"$GITHUB_ENV"

      - name: Check the release secrets are present
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          missing=()
          for name in SIGNING_KEY SIGNING_PASSWORD MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Import the signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          # gpg needs a keyring of its own here; the runner has none.
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p -m 700 "$GNUPGHOME"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          [ -n "$fpr" ] || { echo "::error::the imported key has no secret material"; exit 1; }
          echo "PGP_KEY=$fpr" >>"$GITHUB_ENV"
          echo "GNUPGHOME=$GNUPGHOME" >>"$GITHUB_ENV"
          echo "imported $fpr"

      - name: Publish
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
          PGP_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          # Tags are written v0.2.0 as often as 0.2.0; the artifact version is not.
          version=${VERSION#v}
          export VERSION="$version"
          deployment=$(bash publish.sh --upload | sed -n 's/^deployment: //p')
          [ -n "$deployment" ] || { echo "::error::no deployment id in the upload output"; exit 1; }
          echo "deployment $deployment"
          for attempt in $(seq 1 40); do
            state=$(bash publish.sh --status "$deployment" | python3 -c \
              'import json,sys; print(json.load(sys.stdin)["deploymentState"])')
            echo "attempt $attempt: $state"
            case "$state" in
              VALIDATED) bash publish.sh --publish "$deployment"; break ;;
              FAILED) echo "::error::validation failed"; exit 1 ;;
            esac
            sleep 15
          done
          echo "### screenstream $version" >>"$GITHUB_STEP_SUMMARY"
          echo "Deployment \`$deployment\` submitted to Maven Central." >>"$GITHUB_STEP_SUMMARY"
