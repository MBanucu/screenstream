# The fixture for the `content call` grammar. The Java parser reads this file
# through the test classpath and test/test_control.py reads the same file, so
# the two implementations cannot drift without one of them failing.
#
# Each value is: command|uri|method|comma-separated extras (name:type:value)
status=content call --uri content://io.github.mbanucu.screenstream.control --method status|content://io.github.mbanucu.screenstream.control|status|
grant=adb shell content call --uri content://io.github.mbanucu.screenstream.control --method grant|content://io.github.mbanucu.screenstream.control|grant|
start=adb shell content call --uri content://io.github.mbanucu.screenstream.control --method start --extra port:i:0 --extra encoded_port:i:0|content://io.github.mbanucu.screenstream.control|start|port:i:0,encoded_port:i:0
serial=adb -s emulator-5554 shell content call --uri content://x --method start --extra scale:i:2|content://x|start|scale:i:2
quoted=content call --uri content://x --method status --extra why:s:'a b=c'|content://x|status|why:s:a b=c
