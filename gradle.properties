# Gradle and AGP settings for this repository. Machine-specific paths do not
# belong here: local.properties is per checkout and ignored by git (see
# local.properties.example), and the aapt2 override belongs in
# ~/.gradle/gradle.properties because it is a property of the phone.

# Reuse task outputs between clean builds. The local build cache lives in the
# Gradle user home; docs/termux-build.md records the measured cold/warm times.
org.gradle.caching=true

# The build is configuration-cache compatible on Gradle 9.9.2. A cold,
# --offline first build still needs AGP's Kotlin build-tools artifact in the
# cache; docs/termux-build.md explains why and what to do.
org.gradle.configuration-cache=true

# This is a Java-only library. AGP 9 otherwise wires its built-in Kotlin
# support (and a kotlinBuildToolsApiClasspath resolution) into every variant,
# which is unnecessary here and makes a cold offline configuration-cache store
# fail. Turning it off restores a Java-only task graph.
android.builtInKotlin=false

# android.aapt2FromMavenOverride is required on Termux but AGP labels every use
# of it experimental. The override itself is the documented workaround; this
# suppresses only that unsupported-option notice, not other AGP warnings.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
